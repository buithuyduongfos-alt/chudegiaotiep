<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><script>window.STANDALONE=true</script></head><body>
<title>Từ vựng giao tiếp tiếng Trung</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,700&family=Noto+Serif:wght@400;600&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* Layout: the user's sketch. Dashed capsule of pinyin boxes on the left, green-framed lesson sheet on the right with two big corners. */
:root {
  --bg: #fbfdfb; --sheet: #ffffff; --ink: #1d2a24; --muted: #5d6e65; --line: #cddad2;
  --green: #14894a; --green-soft: #e3f4ea; --blue: #2f5a93; --orange: #d9700f; --orange-soft: #fdeedd;
  --on-green: #ffffff;
  --menu-red: #8f2c25; --menu-gold: #b8860b; --menu-paper: #fdf8ee; --on-red: #ffffff;
  --body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --pinyin: "Noto Serif", Georgia, "Times New Roman", serif;
  --han: "Noto Serif SC", "Songti SC", "SimSun", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111815; --sheet: #17201c; --ink: #e6efe9; --muted: #9db0a5; --line: #33423a;
  --green: #4fce8a; --green-soft: #1d3a2b; --blue: #8db4e6; --orange: #f2a152; --orange-soft: #3c2a18;
  --on-green: #0d1a13; --menu-red: #e58a7f; --menu-gold: #e0b84f; --menu-paper: #211a15; --on-red: #1d1410; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111815; --sheet: #17201c; --ink: #e6efe9; --muted: #9db0a5; --line: #33423a;
  --green: #4fce8a; --green-soft: #1d3a2b; --blue: #8db4e6; --orange: #f2a152; --orange-soft: #3c2a18;
  --on-green: #0d1a13; --menu-red: #e58a7f; --menu-gold: #e0b84f; --menu-paper: #211a15; --on-red: #1d1410; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55 }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px }

.page { max-width: 1120px; margin-inline: auto; padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px }
h1 { margin: 0; font-size: 1.25rem; font-weight: 700 }
.topics { display: flex; flex-wrap: wrap; gap: 8px }
.topic { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: .9rem; font-weight: 500 }
.topic:hover { border-color: var(--green) }
.topic[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--on-green) }
.note { margin: 0; font-size: .85rem; color: var(--muted) }

.study { display: grid; grid-template-columns: 212px minmax(0, 1fr); gap: 24px; align-items: start }

.words { border: 1.5px dashed var(--blue); border-radius: 32px; padding: 16px 12px; display: grid; gap: 4px;
  position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 24px); overflow-y: auto }
.word { background: none; border: 1px solid transparent; border-radius: 10px; padding: 8px 12px; text-align: left;
  font-family: var(--pinyin); font-size: 1.1rem; line-height: 1.3; color: var(--ink) }
.word:hover { background: var(--green-soft) }
.word[aria-current="true"] { background: var(--green-soft); border-color: var(--green); color: var(--green); font-weight: 600 }

.sheet { background: var(--sheet); border: 1.5px solid var(--green); border-radius: 64px 2px 64px 2px;
  padding: 28px clamp(20px, 5vw, 56px) 32px; display: grid; gap: 24px; min-width: 0 }

.head { text-align: center; display: grid; gap: 2px }
.head .py { font-family: var(--pinyin); font-size: 1.05rem; color: var(--muted) }
.head .py span { font-family: var(--han); margin-left: .5em }
h2 { margin: 0; color: var(--green); font-size: clamp(1.5rem, 3.4vw, 2rem); font-weight: 700; font-style: italic; line-height: 1.25; text-wrap: balance }

.pic { width: 280px; max-width: 100%; aspect-ratio: 4 / 3; justify-self: center; border: 1px solid var(--line); border-radius: 4px;
  display: grid; place-items: center; overflow: hidden; color: var(--muted); font-size: .9rem; text-align: center; padding: 12px }
.pic.has { padding: 0 }
.pic img { width: 100%; height: 100%; object-fit: cover; display: block }

.block { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; align-items: start }
.block h3 { margin: 0; padding-top: 7px; font-size: .9rem; font-weight: 700; font-style: italic; color: var(--green) }
.lines { display: grid; gap: 12px; list-style: none; margin: 0; padding: 0; min-width: 0 }
.line { display: grid; grid-template-columns: 16px 22px minmax(0, 1fr) auto; column-gap: 8px; align-items: start }
.tr .line { grid-template-columns: 16px minmax(0, 1fr) }
.arrow { color: var(--green); padding-top: 7px }
.arrow svg { display: block }
.num { font-family: var(--pinyin); font-size: 1.05rem; padding-top: 3px; font-variant-numeric: tabular-nums }
.bullet { padding-top: 4px; color: var(--muted) }
.body { min-width: 0; display: grid; gap: 4px; justify-items: start }
.sent { font-size: 1.05rem; padding-top: 3px }
.sent.pin { font-family: var(--pinyin) }
.sent mark, .ans mark { background: none; color: var(--green); font-weight: 600 }
.han { font-family: var(--han); color: var(--muted) }
.ans { font-family: var(--pinyin); border-left: 2px solid var(--green); padding-left: 10px; display: grid }

.show { background: none; border: 1px solid var(--green); color: var(--green); border-radius: 6px; padding: 4px 12px; font-size: .85rem; font-weight: 600 }
.show:hover { background: var(--green-soft) }

.say { width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--orange-soft); color: var(--orange); display: grid; place-items: center }
.say:hover:not(:disabled) { outline: 1px solid var(--orange) }
.say:disabled { opacity: .45; cursor: not-allowed }
.say.on { background: var(--orange); color: var(--sheet) }

.empty { color: var(--muted); margin: 0; padding-top: 5px; font-size: .95rem }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums }
.nav button { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; color: var(--ink) }
.nav button:hover:not(:disabled) { border-color: var(--green) }
.nav button:disabled { opacity: .4; cursor: default }

/* Online menu */
.menu { background: var(--menu-paper); border-block: 2px solid var(--menu-red); padding: 20px clamp(12px, 3vw, 28px); display: grid; gap: 20px; max-width: 640px; width: 100%; justify-self: center; min-width: 0 }
.mhead { justify-self: center; background: none; border: 0; padding: 4px 16px; color: var(--menu-red); font-family: var(--pinyin); font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1.2 }
.mhint { margin: 0; text-align: center; font-size: .9rem; color: var(--muted) }
.mgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px }
.mgroup { grid-column: 1 / -1; display: grid; gap: 4px; min-width: 0 }
.mgroup.half { grid-column: auto }
.mchips { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding-bottom: 6px }
.mchip { border: 0; border-radius: 999px; padding: 4px 14px; background: var(--menu-red); color: var(--on-red); font-family: var(--pinyin); font-weight: 600 }
.mchip.gold { background: var(--menu-gold) }
.mrow { background: none; border: 0; border-radius: 6px; width: 100%; text-align: left; padding: 6px 8px; display: grid; grid-template-columns: minmax(0, auto) minmax(12px, 1fr) auto; column-gap: 8px; align-items: baseline }
.mrow:hover, .mhead:hover, .mrow.on { background: var(--orange-soft) }
.mchip:hover, .mchip.on { outline: 2px solid var(--orange); outline-offset: 1px }
.mhead.on { background: var(--orange-soft) }
.mname { font-family: var(--pinyin); font-weight: 600; font-size: 1.1rem; color: var(--ink) }
.mname span { font-family: var(--han); font-weight: 400; font-size: .9rem; color: var(--muted); margin-left: .4em }
.mdots { border-bottom: 2px dotted var(--menu-gold); transform: translateY(-4px) }
.mprice { color: var(--menu-red); font-weight: 700; font-variant-numeric: tabular-nums }
.mvi { grid-column: 1 / -1; font-size: .85rem; color: var(--muted) }
.dlrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px }
.dlnote { flex-basis: 100%; min-height: 1.3em; font-size: .9rem; color: var(--muted) }
.mstatus { min-height: 1.4em; margin: 0; text-align: center; font-size: .9rem; color: var(--muted) }

/* Video review */
.vstudy { display: grid; grid-template-columns: minmax(0, 250px) minmax(0, 1fr); gap: 28px; align-items: start }
.vside { display: grid; gap: 8px; position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)) }
.vbox { width: 100%; max-width: 100%; aspect-ratio: 9 / 16; display: block; background: var(--ink); border-radius: 6px }
.vsteps { display: grid; gap: 24px; min-width: 0 }
.step { display: grid; gap: 10px; min-width: 0 }
.step h3 { margin: 0; font-size: 1rem; font-weight: 700; color: var(--green) }
.step p { margin: 0 }
.q { display: grid; gap: 4px; justify-items: start; min-width: 0 }
.q .sent { font-family: var(--han); padding-top: 0 }
.tip { font-size: .9rem; color: var(--muted) }
.vline { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; align-items: start }
.who { font-size: .85rem; font-weight: 600; color: var(--muted) }
.jump { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--green); text-decoration: underline; text-underline-offset: 3px }
.apic { width: 100% }
.abox { width: 100%; max-width: 100%; display: block }
.word.vid + .word.vid { margin-top: 4px }
.word.vid { font-family: var(--body); font-size: .95rem; font-weight: 600; color: var(--blue); border: 1px dashed var(--blue); margin-top: 8px }
.word.vid[aria-current="true"] { background: var(--green-soft); border: 1px solid var(--green); color: var(--green) }

@media (max-width: 760px) {
  .vstudy { grid-template-columns: minmax(0, 1fr) }
  .vside { position: static; justify-items: center }
  .vbox { width: min(250px, 100%) }
  .mgrid { grid-template-columns: minmax(0, 1fr) }
  .abox, .apic { width: min(320px, 100%) }
  .word.vid + .word.vid { margin-top: 0 }
  .word.vid { margin-top: 0 }
  .study { grid-template-columns: minmax(0, 1fr); gap: 16px }
  .words { position: static; max-height: none; display: flex; overflow-x: auto; overflow-y: hidden; border-radius: 20px; padding: 8px }
  .word { flex: none; white-space: nowrap }
  .sheet { border-radius: 40px 2px 40px 2px; padding-inline: 16px }
  .block { grid-template-columns: minmax(0, 1fr); gap: 8px }
  .block h3 { padding-top: 0 }
}
@media (prefers-reduced-motion: no-preference) { .word, .topic, .show { transition: background-color .12s } }
</style>

<div class="page">
  <header class="top">
    <h1>Từ vựng giao tiếp tiếng Trung</h1>
    <nav class="topics" id="topics" aria-label="Chủ đề"></nav>
  </header>
  <p class="note">Bấm vào một từ để xem nghĩa, nghe ví dụ và luyện dịch.</p>
  <main class="study">
    <div class="words" id="words" role="list" aria-label="Danh sách từ vựng"></div>
    <article class="sheet" id="sheet" aria-live="polite"></article>
  </main>
</div>

<script>
/* Dữ liệu: mỗi chủ đề là một dòng ở sheet Chủ đề, mỗi từ là một dòng ở sheet Từ vựng.
   Đặt phần cần tô xanh trong [ngoặc vuông]. image và audio là đường dẫn file, để "" nếu chưa có. */
const TOPICS = [{"name":"Mua trái cây","words":[{"id":"NH-01","py":"suí biàn","han":"随便","vi":"tùy ý","type":"phó từ","image":"media/NH-01.jpg","ex":[{"py":"Zhèlǐ de shuǐguǒ dōu hěn xīnxiān, nǐ [suí biàn] mǎi.","han":"这里的水果都很新鲜，你随便买。","audio":"media/NH-01_1.mp3"},{"py":"Wǒmen diàn de yīfu yòu hǎokàn yòu piányi, nǐ [suí biàn] shìchuān, rúguǒ bù mǎnyì, [suí biàn] tuìhuàn.","han":"我们店的衣服又好看又便宜，你随便试穿，如果不满意，随便退换。","audio":"media/NH-01_2.mp3"}],"tr":[{"vi":"Cứ [tùy ý] xem nhé, thích cái nào thì nói với tôi.","py":"Nǐ [suí biàn] kàn, xǐhuan nǎge jiù gàosu wǒ.","han":"你随便看，喜欢哪个就告诉我。"},{"vi":"Táo ở đây đều rất ngọt, bạn cứ [tùy ý] chọn.","py":"Zhèr de píngguǒ dōu hěn tián, nǐ [suí biàn] tiāo.","han":"这儿的苹果都很甜，你随便挑。"}]},{"id":"NH-02","py":"tiāo","han":"挑","vi":"chọn lựa","type":"động từ","image":"media/NH-02.jpg","ex":[{"py":"Nǐ búyào [tiāo] le, zhèxiē dōu hěn tián.","han":"你不要挑了，这些都很甜。","audio":"media/NH-02_1.mp3"},{"py":"Jīntiān wǒ yǒu qián, zhèxiē yīfu guì háishi piányi méi guānxi, nǐ xǐhuan jiù suíbiàn [tiāo] ba.","han":"今天我有钱，这些衣服贵还是便宜没关系，你喜欢就随便挑吧。","audio":"media/NH-02_2.mp3"}],"tr":[{"vi":"Mẹ tôi đang [chọn] nho ở sạp trái cây.","py":"Wǒ māma zài shuǐguǒtān [tiāo] pútao.","han":"我妈妈在水果摊挑葡萄。"},{"vi":"Bạn [chọn] giúp tôi hai cân táo nhé.","py":"Nǐ bāng wǒ [tiāo] liǎng jīn píngguǒ ba.","han":"你帮我挑两斤苹果吧。"}]},{"id":"NH-03","py":"xīn xiān","han":"新鲜","vi":"tươi","type":"tính từ","image":"media/NH-03.jpg","ex":[{"py":"Píngguǒ bù [xīn xiān] bú yào qián.","han":"苹果不新鲜不要钱。","audio":"media/NH-03_1.mp3"},{"py":"Zhè zhǒng hóng píngguǒ yòu [xīn xiān] yòu piányi.","han":"这种红苹果又新鲜又便宜。","audio":"media/NH-03_2.mp3"}],"tr":[{"vi":"Trái cây ở siêu thị này không [tươi] lắm.","py":"Zhè jiā chāoshì de shuǐguǒ bú tài [xīn xiān].","han":"这家超市的水果不太新鲜。"},{"vi":"Những chùm nho này rất [tươi], hôm nay mới về.","py":"Zhèxiē pútao hěn [xīn xiān], shì jīntiān gāng dào de.","han":"这些葡萄很新鲜，是今天刚到的。"}]},{"id":"NH-04","py":"tián","han":"甜","vi":"ngọt","type":"tính từ","image":"media/NH-04.jpg","ex":[{"py":"Nǐ búyào hē tài [tián] de nǎichá.","han":"你不要喝太甜的奶茶。","audio":"media/NH-04_1.mp3"},{"py":"Wǒmen de shuǐguǒ bǐ chāoshì lǐ gèng [tián], nǐ fàngxīn mǎi.","han":"我们的水果比超市里更甜，你放心买。","audio":"media/NH-04_2.mp3"}],"tr":[{"vi":"Quả táo này rất [ngọt], bạn nếm thử đi.","py":"Zhège píngguǒ hěn [tián], nǐ chángchang.","han":"这个苹果很甜，你尝尝。"},{"vi":"Tôi không thích ăn đồ quá [ngọt].","py":"Wǒ bù xǐhuan chī tài [tián] de dōngxi.","han":"我不喜欢吃太甜的东西。"}]},{"id":"NH-05","py":"bú dàn … ér qiě","han":"不但…而且","vi":"không những … mà còn","type":"liên từ","image":"media/NH-05.jpg","ex":[{"py":"Zhèlǐ de yīfu [bú dàn] kuǎnshì duō, [ér qiě] jiàgé bú guì.","han":"这里的衣服不但款式多，而且价格不贵。","audio":"media/NH-05_1.mp3"},{"py":"Diànyuán [bú dàn] bāng wǒ zhǎole héshì de chǐmǎ, [ér qiě] hái zhǔdòng gěi wǒ dǎle zhé.","han":"店员不但帮我找了合适的尺码，而且还主动给我打了折。","audio":"media/NH-05_2.mp3"}],"tr":[{"vi":"Trái cây ở tiệm này [không những] tươi [mà còn] rẻ.","py":"Zhè jiā diàn de shuǐguǒ [bú dàn] xīnxiān, [ér qiě] piányi.","han":"这家店的水果不但新鲜，而且便宜。"},{"vi":"Nhà hàng này [không những] món ngon [mà còn] phục vụ rất nhiệt tình.","py":"Zhè jiā fàndiàn [bú dàn] cài hǎochī, [ér qiě] fúwù hěn rèqíng.","han":"这家饭店不但菜好吃，而且服务很热情。"}]},{"id":"NH-06","py":"chāo shì","han":"超市","vi":"siêu thị","type":"danh từ","image":"media/NH-06.jpg","ex":[{"py":"Tāmen de píngguǒ bǐ [chāo shì] piányi.","han":"他们的苹果比超市便宜。","audio":"media/NH-06_1.mp3"},{"py":"[Chāo shì] de shuǐguǒ bù xīnxiān.","han":"超市的水果不新鲜。","audio":"media/NH-06_2.mp3"}],"tr":[{"vi":"Tôi thường xuyên đến [siêu thị] này mua trái cây.","py":"Wǒ jīngcháng qù zhège [chāo shì] mǎi shuǐguǒ.","han":"我经常去这个超市买水果。"},{"vi":"Gần nhà tôi có một [siêu thị] lớn.","py":"Wǒ jiā fùjìn yǒu yí ge dà [chāo shì].","han":"我家附近有一个大超市。"}]},{"id":"NH-07","py":"shuǐ guǒ tān","han":"水果摊","vi":"quầy, sạp trái cây","type":"danh từ","image":"media/NH-07.jpg","ex":[{"py":"Zhège [shuǐ guǒ tān] de pútao yòu dà yòu tián.","han":"这个水果摊的葡萄又大又甜。","audio":"media/NH-07_1.mp3"},{"py":"Suīrán wǒ de [tān zi] bú dà, dànshì const SPEAKER = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const ARROW = '<svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true"><path d="M0 4h9V0l7 6-7 6V8H0z"/></svg>';

const $ = id => document.getElementById(id);
const make = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
/* Biến "a [b] c" thành chữ thường và thẻ mark, luôn dùng textContent để an toàn. */
function marked(el, text) {
  text.split(/(\[[^\]]*\])/).forEach(p => {
    if (/^\[.*\]$/.test(p)) el.append(make("mark", "", p.slice(1, -1))); else if (p) el.append(p);
  });
  return el;
}

let topicIdx = 0, wordIdx = 0, player = null, view = "word", videoIdx = 0, videoStop = null;

function stopAudio() { try { window.speechSynthesis?.cancel(); } catch (e) {} document.querySelectorAll(".mrow.on, .mchip.on, .mhead.on").forEach(b => b.classList.remove("on")); if (player) { player.pause(); player = null; } document.querySelectorAll(".say.on").forEach(b => b.classList.remove("on")); }

function revealButton(content, showText = "Hiển thị") {
  const b = make("button", "show", showText);
  b.type = "button"; b.setAttribute("aria-expanded", "false");
  content.hidden = true;
  b.onclick = () => {
    content.hidden = !content.hidden;
    b.textContent = content.hidden ? showText : "Ẩn";
    b.setAttribute("aria-expanded", String(!content.hidden));
  };
  return b;
}

function speaker(src) {
  const b = make("button", "say");
  b.type = "button"; b.innerHTML = SPEAKER;
  if (!src) { b.disabled = true; b.title = "Chưa có file nghe"; b.setAttribute("aria-label", "Chưa có file nghe"); return b; }
  b.setAttribute("aria-label", "Nghe câu ví dụ");
  b.onclick = () => {
    const wasOn = b.classList.contains("on");
    stopAudio();
    if (wasOn) return;
    player = new Audio(src);
    b.classList.add("on");
    player.onended = player.onerror = () => b.classList.remove("on");
    player.play().catch(() => b.classList.remove("on"));
  };
  return b;
}

function exampleLine(item, i) {
  const li = make("li", "line");
  const arrow = make("span", "arrow"); arrow.innerHTML = ARROW;
  const body = make("div", "body");
  const text = make("div");
  text.append(marked(make("div", "sent pin"), item.py));
  if (item.han) text.append(make("div", "han", item.han));
  body.append(revealButton(text), text);
  li.append(arrow, make("span", "num", (i + 1) + ","), body, speaker(item.audio));
  return li;
}

function translateLine(item) {
  const li = make("li", "line");
  const body = make("div", "body");
  const ans = make("div", "ans");
  ans.append(marked(make("span"), item.py));
  if (item.han) ans.append(make("span", "han", item.han));
  body.append(marked(make("div", "sent"), item.vi), revealButton(ans, "Hiển thị đáp án"), ans);
  li.append(make("span", "bullet", "•"), body);
  return li;
}

function block(title, items, render, cls, emptyText) {
  const sec = make("section", "block " + cls);
  sec.append(make("h3", "", title));
  if (items.length) { const ul = make("ul", "lines"); items.forEach((it, i) => ul.append(render(it, i))); sec.append(ul); }
  else sec.append(make("p", "empty", emptyText));
  return sec;
}

function renderSheet() {
  stopAudio();
  const sheet = $("sheet"), topic = TOPICS[topicIdx], list = topic.words, word = list[wordIdx];
  sheet.replaceChildren();
  if (view === "video") {
    const item = topic.videos[videoIdx];
    if (item.kind === "menu") renderMenu(sheet, item, topic); else renderVideo(sheet, item, topic);
    return;
  }
  if (!word) { sheet.append(make("p", "empty", "Chủ đề này chưa có từ vựng.")); return; }

  const head = make("header", "head");
  const py = make("div", "py", word.py);
  if (word.han) py.append(make("span", "", word.han));
  head.append(py, make("h2", "", `${word.vi} (${word.type})`));

  const pic = make("div", "pic");
  if (word.image) { const img = make("img"); img.src = word.image; img.alt = word.vi; pic.classList.add("has"); pic.append(img); }
  else pic.textContent = "Hình ảnh sẽ được thêm sau";

  const nav = make("footer", "nav");
  const prev = make("button", "", "← Từ trước"), next = make("button", "", "Từ sau →");
  prev.type = next.type = "button";
  const last = wordIdx === list.length - 1;
  if (last && topic.videos) next.textContent = `${topic.videos[0].label} →`;
  prev.disabled = wordIdx === 0; next.disabled = last && !topic.videos;
  prev.onclick = () => pick(wordIdx - 1); next.onclick = () => last ? showVideo(0) : pick(wordIdx + 1);
  nav.append(prev, make("span", "", `${wordIdx + 1} / ${list.length}`), next);

  sheet.append(head, pic,
    block("Ví dụ", word.ex, exampleLine, "ex", "Từ này chưa có câu ví dụ."),
    block("Luyện dịch", word.tr, translateLine, "tr", "Từ này chưa có câu luyện dịch."),
    nav);
}

/* Mục video: 1 xem không phụ đề, 2 trả lời câu hỏi, 3 xem lại lời thoại */
function linkedText(el, text, links) {
  text.split(/(\[[^\]]*\])/).forEach(p => {
    const inner = /^\[.*\]$/.test(p) ? p.slice(1, -1) : null;
    if (inner === null) { if (p) el.append(p); return; }
    const id = links[inner];
    if (!id) { el.append(make("mark", "", inner)); return; }
    const b = make("button", "jump", inner);
    b.type = "button"; b.title = "Xem lại từ này";
    b.onclick = () => pick(TOPICS[topicIdx].words.findIndex(x => x.id === id));
    el.append(b);
  });
  return el;
}

/* Tải về: trong trang Claude dùng quyền tải của trình xem, bản sao mở từ máy thì tải trực tiếp */
const LOCAL = window.STANDALONE === true;
const dlReady = LOCAL ? Promise.resolve(true) : (window.claude?.use ? window.claude.use("downloads") : Promise.resolve(null));

function scriptText(v) {
  const clean = t => t.replace(/[\[\]]/g, "");
  const body = v.lines.map(l => `${l.who}: ${l.han}\n${clean(l.py)}\n${l.vi}`).join("\n\n");
  return `\ufeff${v.title}\n\n${body}\n`;
}

async function download(filename, source, note) {
  note.textContent = "";
  if (LOCAL) {
    const a = document.createElement("a");
    a.download = filename;
    a.href = typeof source === "string" && source.startsWith("media/") ? source : URL.createObjectURL(new Blob([source], { type: "text/plain;charset=utf-8" }));
    a.click();
    return;
  }
  try {
    const d = await dlReady;
    let data = source;
    if (source.startsWith("media/")) {
      note.textContent = "Đang chuẩn bị file...";
      const res = await fetch(source);
      if (!res.ok) throw { code: "fetch" };
      data = await res.blob();
    }
    note.textContent = "";
    await d.save({ filename, data });
    note.textContent = `Đã tải ${filename}.`;
  } catch (e) {
    note.textContent = e?.code === "declined" ? "" : e?.code === "rate_limited"
      ? "Đang có một yêu cầu tải khác, bạn thử lại sau giây lát."
      : "Chưa tải được file. Bạn thử lại sau.";
  }
}

function downloadRow(v) {
  const row = make("section", "step");
  row.hidden = true;
  const box = make("div", "dlrow");
  const note = make("span", "dlnote"); note.setAttribute("aria-live", "polite");
  const audio = make("button", "show", "Tải file nghe (.mp4)");
  const script = make("button", "show", "Tải lời thoại (.txt)");
  audio.type = script.type = "button";
  audio.onclick = () => download(`${v.dl}.mp4`, `media/${v.dl}.mp4`, note);
  script.onclick = () => download(`${v.dl}-loi-thoai.txt`, scriptText(v), note);
  box.append(audio, script, note);
  row.append(make("h3", "", "Tải về máy"), box);
  dlReady.then(d => { row.hidden = !d; });
  return row;
}

function renderVideo(sheet, v, topic) {
  const head = make("header", "head");
  head.append(make("h2", "", v.title));

  const isAudio = v.kind === "audio";
  const video = make(isAudio ? "audio" : "video", isAudio ? "abox" : "vbox");
  video.controls = true; video.preload = "metadata"; video.src = v.src;
  if (!isAudio) { video.setAttribute("playsinline", ""); video.poster = v.poster; }
  const seg = () => { if (videoStop != null && video.currentTime >= videoStop) { video.pause(); videoStop = null; } };
  video.ontimeupdate = seg;
  video.onseeking = () => { if (!video.dataset.seg) videoStop = null; delete video.dataset.seg; };
  const side = make("div", "vside");
  if (isAudio) {
    const pic = make("div", "pic apic");
    if (v.image) { const img = make("img"); img.src = v.image; img.alt = v.title; pic.classList.add("has"); pic.append(img); }
    else pic.textContent = "Hình ảnh sẽ được thêm sau";
    side.append(pic);
  }
  side.append(video);

  const s1 = make("section", "step");
  s1.append(make("h3", "", isAudio ? "Bước 1. Nghe không xem lời thoại" : "Bước 1. Xem và nghe không phụ đề"), make("p", "tip", isAudio ? "Nghe một đến hai lần. Bạn nghe được những từ nào vừa ôn?" : "Xem video một đến hai lần. Bạn nghe được những từ nào vừa ôn?"));

  const s2 = make("section", "step");
  s2.append(make("h3", "", "Bước 2. Trả lời câu hỏi"));
  const qs = make("ol", "lines");
  v.questions.forEach(q => {
    const li = make("li", "q");
    li.append(make("div", "sent", q.han), make("div", "sent pin", q.py), make("div", "tip", q.vi));
    const ans = make("div", "ans");
    if (q.aHan) {
      ans.append(make("span", "han", q.aHan), make("span", "", q.aPy), make("span", "tip", q.aVi));
      li.append(revealButton(ans, "Hiển thị đáp án"), ans);
    }
    qs.append(li);
  });
  s2.append(qs);

  const s3 = make("section", "step");
  s3.append(make("h3", "", "Bước 3. Xem lại lời thoại"), make("p", "tip", v.lines.length ? "Bấm loa để nghe lại từng câu. Bấm từ gạch chân để xem lại từ đó." : "Lời thoại sẽ được thêm sau."));
  const ls = make("ul", "lines");
  v.lines.forEach(l => {
    const li = make("li", "vline");
    const body = make("div", "body");
    body.append(make("div", "who", l.who));
    if (l.py) {
      const text = make("div");
      text.append(linkedText(make("div", "sent pin"), l.py, l.links), make("div", "han", l.han), make("div", "tip", l.vi));
      body.append(revealButton(text), text);
    } else body.append(make("p", "empty", "Lời thoại câu này sẽ được thêm sau."));
    const say = make("button", "say");
    say.type = "button"; say.innerHTML = SPEAKER; say.setAttribute("aria-label", "Nghe lại câu này");
    say.onclick = () => { video.dataset.seg = "1"; video.currentTime = l.start; videoStop = l.end; video.play().catch(() => {}); };
    li.append(body, say);
    ls.append(li);
  });
  s3.append(ls);

  const steps = make("div", "vsteps"); steps.append(s1, s2, s3, downloadRow(v));
  const wrap = make("div", "vstudy"); wrap.append(side, steps);

  sheet.append(head, wrap, itemNav(topic));
}

function itemNav(topic) {
  const nav = make("footer", "nav");
  const back = make("button", "", "← Về từ vựng");
  back.type = "button"; back.onclick = () => pick(wordIdx);
  nav.append(back);
  if (videoIdx < topic.videos.length - 1) {
    const more = make("button", "", `${topic.videos[videoIdx + 1].label} →`);
    more.type = "button"; more.onclick = () => showVideo(videoIdx + 1);
    nav.append(more);
  }
  return nav;
}

/* Thực đơn: có file ghi âm thì phát file, chưa có thì nhờ giọng đọc tiếng Trung của thiết bị */
function speak(item, btn, status) {
  stopAudio();
  status.textContent = "";
  btn.classList.add("on");
  const done = () => btn.classList.remove("on");
  if (item.audio) {
    player = new Audio(item.audio);
    player.onended = player.onerror = done;
    player.play().catch(done);
    return;
  }
  const synth = window.speechSynthesis, voices = synth?.getVoices() || [];
  if (!synth || (voices.length && !voices.some(v => /^zh/i.test(v.lang)))) {
    done(); status.textContent = "Thiết bị này chưa có giọng đọc tiếng Trung."; return;
  }
  const u = new SpeechSynthesisUtterance(item.han);
  u.lang = "zh-CN"; u.rate = 0.85; u.onend = u.onerror = done;
  synth.speak(u);
}

function renderMenu(sheet, m, topic) {
  const head = make("header", "head");
  head.append(make("h2", "", m.title));
  const status = make("p", "mstatus"); status.setAttribute("aria-live", "polite");
  const hint = make("p", "mhint", "Bấm vào bất kỳ chữ nào trên thực đơn để nghe đọc.");
  const card = make("div", "menu");
  const title = make("button", "mhead", m.head.py);
  title.type = "button"; title.title = m.head.vi; title.onclick = () => speak(m.head, title, status);
  const grid = make("div", "mgrid");
  m.groups.forEach(g => {
    const box = make("section", "mgroup" + (g.half ? " half" : ""));
    const chips = make("div", "mchips");
    g.chips.forEach((c, i) => {
      const b = make("button", "mchip" + (i ? " gold" : ""), c.py);
      b.type = "button"; b.title = `${c.han} · ${c.vi} · ${c.en}`; b.onclick = () => speak(c, b, status);
      chips.append(b);
    });
    box.append(chips);
    g.items.forEach(it => {
      const b = make("button", "mrow");
      b.type = "button";
      const name = make("span", "mname", it.py); name.append(make("span", "", it.han));
      b.append(name, make("span", "mdots"), make("span", "mprice", `¥${it.price}`), make("span", "mvi", `${it.vi} · ${it.en}`));
      b.onclick = () => speak(it, b, status);
      box.append(b);
    });
    grid.append(box);
  });
  card.append(title, grid);
  sheet.append(head, hint, card, status, itemNav(topic));
}

function showVideo(i) { view = "video"; videoIdx = i; renderWords(); renderSheet(); }

function renderWords() {
  const box = $("words"), topic = TOPICS[topicIdx];
  box.replaceChildren(...topic.words.map((x, i) => {
    const b = make("button", "word", x.py);
    b.type = "button"; b.setAttribute("role", "listitem");
    if (view === "word" && i === wordIdx) b.setAttribute("aria-current", "true");
    b.onclick = () => pick(i);
    return b;
  }));
  (topic.videos || []).forEach((it, i) => {
    const b = make("button", "word vid", it.label);
    b.type = "button"; b.setAttribute("role", "listitem");
    if (view === "video" && i === videoIdx) b.setAttribute("aria-current", "true");
    b.onclick = () => showVideo(i);
    box.append(b);
  });
  box.querySelector('[aria-current="true"]')?.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function pick(i) { view = "word"; wordIdx = i; renderWords(); renderSheet(); }

function renderTopics() {
  $("topics").replaceChildren(...TOPICS.map((t, i) => {
    const b = make("button", "topic", t.name);
    b.type = "button"; b.setAttribute("aria-pressed", String(i === topicIdx));
    b.onclick = () => { topicIdx = i; wordIdx = 0; view = "word"; renderTopics(); renderWords(); renderSheet(); };
    return b;
  }));
}

renderTopics(); renderWords(); renderSheet();
</script>
